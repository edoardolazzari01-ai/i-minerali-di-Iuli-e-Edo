<title>I minerali di Iuli e Edo</title>
<style>
:root {
  --bg:#f5f7fa; --card:#fff; --text:#17212b; --muted:#657381;
  --accent:#245b7a; --accent2:#dcecf5; --border:#dce3e8;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
header{background:linear-gradient(135deg,#173d54,#2d6f8e);color:#fff;padding:42px 20px 34px}
header .wrap, main{max-width:1050px;margin:auto}
h1{margin:0 0 8px;font-size:clamp(30px,5vw,46px)}
.subtitle{margin:0;opacity:.9;font-size:17px}
.searchbox{margin-top:24px;display:flex;gap:10px;flex-wrap:wrap}
input{flex:1;min-width:240px;padding:15px 17px;border:0;border-radius:12px;font-size:16px;outline:none}
select{padding:15px 17px;border:0;border-radius:12px;font-size:16px;background:white;min-width:230px}
main{padding:28px 20px 60px}
.status{color:var(--muted);margin:0 0 18px}
.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.result{background:var(--card);border:1px solid var(--border);border-radius:15px;padding:18px;cursor:pointer;transition:.15s}
.result:hover{transform:translateY(-2px);box-shadow:0 7px 20px rgba(0,0,0,.07);border-color:#b9cbd6}
.result h3{margin:0 0 6px;color:var(--accent);font-size:19px}
.result .it{font-weight:600;margin-bottom:9px}
.badge{display:inline-block;background:var(--accent2);color:var(--accent);padding:5px 8px;border-radius:999px;font-size:12px}
.modal{display:none;position:fixed;inset:0;background:rgba(10,20,28,.55);padding:20px;overflow:auto;z-index:5}
.modal.open{display:flex;align-items:flex-start;justify-content:center}
.panel{background:white;max-width:900px;width:100%;margin:30px auto;border-radius:18px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.panel-head{padding:24px;background:#edf5f9;border-bottom:1px solid var(--border);position:relative}
.panel-head h2{margin:0 35px 4px 0;color:var(--accent)}
.close{position:absolute;right:18px;top:14px;border:0;background:transparent;font-size:30px;cursor:pointer;color:#53636e}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;border-top:1px solid var(--border)}
.field{padding:15px 18px;border-right:1px solid var(--border);border-bottom:1px solid var(--border)}
.field.full{grid-column:1/-1}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;margin-bottom:5px}
.value{line-height:1.5}
@media(max-width:650px){.grid{grid-template-columns:1fr}.field{border-right:0}}
.empty{padding:35px;text-align:center;color:var(--muted);background:white;border-radius:15px;border:1px solid var(--border)}
footer{text-align:center;color:var(--muted);font-size:13px;padding:0 20px 30px}
</style>
</head>

e", "Description": "Roccia metamorfica ornamentale dominata dalla lazurite, spesso associata a calcite, pirite e altri minerali del gruppo della sodalite. Il colore blu intenso è dovuto principalmente alla lazurite.", "Diagnostic features": "Blu intenso, possibili venature bianche di calcite e inclusioni dorate di pirite.", "Notes": "Non è una singola specie minerale."}, {"English name": "Snowflake obsidian", "Italian name": "Ossidiana fiocco di neve", "Category": "Vetro vulcanico con sferuliti", "Formula": "Composizione variabile, generalmente ricca in SiO₂", "Crystal system": "Amorfa; sferuliti cristalline", "Mohs hardness": "5–5.5 circa", "Specific gravity (g/cm³)": "2.3–2.6 circa", "Luster": "Vitreous", "Cleavage": "None", "Fracture": "Conchoidal", "Color": "Black with white/grey 'snowflake' spherulites", "Streak": "White to pale", "Transparency": "Opaque to translucent", "Description": "Ossidiana contenente sferuliti chiare, spesso formate da cristobalite e/o feldspato, che producono il caratteristico disegno a fiocco di neve.", "Diagnostic features": "Matrice nera vitrea con sferuliti bianche o grigie distribuite al suo interno.", "Notes": "È una varietà di ossidiana, quindi non un minerale cristallino."}, {"English name": "Green aventurine", "Italian name": "Avventurina verde", "Category": "Varietà di quarzo/quarzite ornamentale", "Formula": "SiO₂ con inclusioni cromofore", "Crystal system": "Trigonal (quarzo)", "Mohs hardness": "6.5–7", "Specific gravity (g/cm³)": "2.6–2.7 circa", "Luster": "Vitreous; aventurescence", "Cleavage": "None", "Fracture": "Conchoidal to uneven", "Color": "Green", "Streak": "White", "Transparency": "Translucent to opaque", "Description": "Materiale siliceo con inclusioni lamellari, spesso fuchsite, che producono l'avventurescenza: un luccichio dovuto alla riflessione della luce sulle inclusioni.", "Diagnostic features": "Colore verde e tipico scintillio interno (avventurescenza), oltre a durezza elevata.", "Notes": "Il termine può choidal", "Color": "Purple, green, yellow, blue, colourless and many others", "Streak": "White", "Transparency": "Transparent to translucent", "Description": "Fluoruro di calcio, spesso presente in cristalli cubici o ottaedrici. È caratterizzata da sfaldatura perfetta in quattro direzioni e può mostrare fluorescenza.", "Diagnostic features": "Durezza 4, sfaldatura perfetta in quattro direzioni e frequenti cristalli cubici.", "Notes": "La fluorescenza dipende da elementi in traccia e difetti del reticolo."}, {"English name": "Clear quartz", "Italian name": "Quarzo ialino / quarzo cristallo di rocca", "Category": "Quarzo", "Formula": "SiO₂", "Crystal system": "Trigonal", "Mohs hardness": "7", "Specific gravity (g/cm³)": "2.65", "Luster": "Vitreous", "Cleavage": "None / very poor", "Fracture": "Conchoidal", "Color": "Colourless", "Streak": "White", "Transparency": "Transparent", "Description": "Quarzo incolore e trasparente, spesso in cristalli ben formati con prisma esagonale e terminazioni piramidali. È una delle forme più riconoscibili del quarzo.", "Diagnostic features": "Trasparenza elevata, cristalli esagonali, durezza 7 e frattura concoide.", "Notes": "Il termine 'clear quartz' è prevalentemente descrittivo/commerciale; 'cristallo di rocca' è il termine tradizionale."}, {"English name": "Red agate", "Italian name": "Agata rossa", "Category": "Varietà di calcedonio/quarzo microcristallino", "Formula": "SiO₂ con impurità, soprattutto ossidi di Fe", "Crystal system": "Trigonal (quarzo; struttura microcristallina)", "Mohs hardness": "6.5–7", "Specific gravity (g/cm³)": "2.58–2.64", "Luster": "Waxy to vitreous", "Cleavage": "None", "Fracture": "Conchoidal", "Color": "Red, orange-red, brownish red; often banded", "Streak": "White", "Transparency": "Translucent to opaque", "Description": "Agata con tonalità rosse dovute principalmente a ossidi e idrossidi di ferro. Può mostrare bande concentriche o parallele tipiche della deposizione di calcedonio in cavità.", "Diagnostic features": "Bande di calcedonio, durezza 6.5–7, frattura concoide e colorazione rossa.", "Notes": "Il nome indica una varietà di agata, non una specie mineralogica distinta."}];

const labels = {
  "Italian name":"Nome italiano","English name":"Nome inglese","Category":"Categoria",
  "Formula":"Formula chimica","Crystal system":"Sistema cristallino","Mohs hardness":"Durezza Mohs",
  "Specific gravity (g/cm³)":"Densità","Luster":"Lucentezza","Cleavage":"Sfaldatura",
  "Fracture":"Frattura","Color":"Colore","Streak":"Striscio","Transparency":"Trasparenza",
  "Description":"Descrizione","Diagnostic features":"Caratteri diagnostici","Notes":"Note"
};

const search = document.getElementById('search');
const category = document.getElementById('category');
const results = document.getElementById('results');
const status = document.getElementById('status');
const modal = document.getElementById('modal');
const details = document.getElementById('details');

[...new Set(minerals.map(m=>m.Category))].sort().forEach(c => {
  const o=document.createElement('option'); o.value=c; o.textContent=c; category.appendChild(o);
});

function render() {
  const q=search.value.trim().toLowerCase();
  const cat=category.value;
  const filtered=minerals.filter(m => {
    const hay=Object.values(m).join(' ').toLowerCase();
    return (!q || hay.includes(q)) && (!cat || m.Category===cat);
  });
  status.textContent=`${filtered.length} risultati`;
  results.innerHTML='';
  if(!filtered.length) {
    results.innerHTML='<div class="empty">Nessun minerale trovato. Prova con un altro termine.</div>';
    return;
  }
  filtered.forEach((m,i)=>{
    const card=document.createElement('article'); card.className='result';
    card.innerHTML=`<h3>${esc(m["English name"])}</h3>
      <div class="it">${esc(m["Italian name"])}</div>
      <span class="badge">${esc(m["Category"])}</span>`;
    card.onclick=()=>openMineral(m);
    results.appendChild(card);
  });
}

function openMineral(m) {
  document.getElementById('modalTitle').textContent=m["Italian name"];
  document.getElementById('modalSubtitle').textContent=m["English name"];
  details.innerHTML='';
  const order=["Category","Formula","Crystal system","Mohs hardness","Specific gravity (g/cm³)",
    "Luster","Cleavage","Fracture","Color","Streak","Transparency","Description","Diagnostic features","Notes"];
  order.forEach(k=>{
    const d=document.createElement('div');
    d.className='field'+(["Description","Diagnostic features","Notes"].includes(k)?' full':'');
    d.innerHTML=`<div class="label">${esc(labels[k])}</div><div class="value">${esc(m[k] ?? "—")}</div>`;
    details.appendChild(d);
  });
  modal.classList.add('open');
  document.body.style.overflow='hidden';
}

function closeModal() {
  modal.classList.remove('open'); document.body.style.overflow='';
}
document.getElementById('close').onclick=closeModal;
modal.onclick=e=>{if(e.target===modal) closeModal();};
document.addEventListener('keydown',e=>{if(e.key==='Escape') closeModal();});
search.addEventListener('input',render);
category.addEventListener('change',render);

function esc(v) {
  return String(v).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
}
render();
</script>
</body>
</html>
